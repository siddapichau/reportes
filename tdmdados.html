<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDM - Dados Diários</title>

    <!-- SISTEMA ANTI-ACESSO DIRETO -->
    <script>
        if (window === window.top) {
            const paginaAtual = window.location.pathname.split('/').pop() || 'tdmdados.html';
            window.location.replace('index.html?page=' + paginaAtual);
        }
    </script>

    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-mercado-livre-icon-svg-download-png-14549372.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        :root { --border-light: rgba(255, 255, 255, 0.2); --bg-header: rgba(15, 23, 42, 0.6); }
        [data-theme="light"] { --border-light: rgba(0, 0, 0, 0.1); }

        html, body { width: 100%; min-height: 100%; background: transparent !important; }
        body { padding: 10px; display: flex; flex-direction: column; gap: 12px; height: 100vh; overflow: hidden; font-size: 1.0rem; }

        .glass-panel { background-color: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-card); border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        .header { padding: 12px 20px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; background-color: #FFF159 !important; border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .header-title-wrapper { flex: 1; text-align: center; color: #2D3277 !important; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; font-size: 1.15rem; }
        .ml-logo { height: 32px; width: auto; object-fit: contain; }
        .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-header { padding: 9px 14px; border: none; border-radius: 8px; font-weight: 800; font-size: 0.8rem; cursor: pointer; transition: 0.2s; color: #fff; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .btn-blue { background: var(--accent-blue); }
        .btn-header:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        .date-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 20px; flex-wrap: wrap; }
        .date-bar label { font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.8rem; }
        .date-bar input[type="date"] { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-light); background: var(--bg-card); color: var(--text-main); font-weight: 600; font-family: 'Inter'; }
        .date-bar .info-user { margin-left: auto; font-size: 0.8rem; color: var(--text-muted); font-weight: 700; }
        .nav-btn { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-light); background: var(--bg-card); color: var(--text-main); font-weight: 800; cursor: pointer; }

        /* KPIs */
        .kpi-row { flex: 0 0 auto; display: flex; gap: 10px; }
        .kpi-card { flex: 1; padding: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; border-left: 4px solid var(--accent-blue); }
        .kpi-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; text-align: center; }
        .kpi-value { font-size: 1.9rem; font-weight: 900; color: var(--text-main); }
        .kpi-card.green { border-left-color: var(--accent-green); }
        .kpi-card.red { border-left-color: var(--accent-red); }
        .kpi-card.warn { border-left-color: var(--accent-warn); }

        /* ÁREA DE AVISOS (pendências) */
        .warn-panel { flex: 0 0 auto; max-height: 200px; overflow-y: auto; padding: 12px 16px; }
        .warn-title { font-weight: 900; color: var(--accent-red); text-transform: uppercase; font-size: 0.8rem; margin-bottom: 8px; }
        .warn-item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid var(--border-card); font-size: 0.85rem; }
        .warn-item:last-child { border-bottom: none; }
        .warn-item .nm { font-weight: 800; color: var(--text-title); }
        .folga-btn { padding: 5px 11px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; border: 1px solid var(--border-card); background: var(--bg-body); color: var(--text-muted); cursor: pointer; transition: 0.15s; }
        .folga-btn.sim { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
        .folga-btn.nao { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
        .folga-btn:hover { transform: translateY(-1px); }

        /* TABELA */
        .table-wrap { flex: 1; overflow: auto; border-radius: 8px; border: 1px solid var(--border-light); }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
        thead { background-color: var(--bg-header); color: var(--text-title); position: sticky; top: 0; z-index: 1; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-card); white-space: nowrap; vertical-align: middle; }
        th { font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; font-size: 0.7rem; }
        tbody tr:nth-child(even) { background-color: rgba(0,0,0,0.04); }
        tbody tr:hover { background-color: rgba(52, 131, 250, 0.12) !important; }
        .pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 900; color: #fff; }
        .pill.presente { background: var(--accent-green); }
        .pill.falta { background: var(--accent-red); }
        .pill.atestado { background: var(--accent-warn); }
        .pill.ferias { background: #8E44AD; }
        .pill.folga { background: #6C5CE7; }
        .pill.vazio { background: var(--text-muted); }
        .ok { color: var(--accent-green); font-weight: 900; }
        .no { color: var(--accent-red); font-weight: 900; }
        .progress { background: var(--bg-body); border-radius: 20px; height: 8px; width: 90px; overflow: hidden; border: 1px solid var(--border-card); }
        .progress > div { height: 100%; background: var(--accent-green); }

        .saved-toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent-green); color: #fff; padding: 12px 18px; border-radius: 8px; font-weight: 800; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 99999; opacity: 0; transform: translateY(10px); transition: 0.3s; pointer-events: none; }
        .saved-toast.show { opacity: 1; transform: translateY(0); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    </style>
</head>
<body data-theme="light">

    <div class="header glass-panel">
        <div class="header-left">
            <img src="https://upload.wikimedia.org/wikipedia/pt/0/04/Logotipo_MercadoLivre.png" alt="Mercado Livre" class="ml-logo">
        </div>
        <div class="header-title-wrapper" id="main-title">TDM — Dados Diários</div>
        <div class="header-controls">
            <button class="btn-header btn-blue" onclick="window.location.href='tdm.html'">📋 Ir para TDM</button>
        </div>
    </div>

    <div class="date-bar glass-panel">
        <button class="nav-btn" onclick="mudarDia(-1)">◀ Anterior</button>
        <input type="date" id="dataSelecionada" onchange="carregarDia()">
        <button class="nav-btn" onclick="mudarDia(1)">Próximo ▶</button>
        <button class="nav-btn" onclick="irParaHoje()">Hoje</button>
        <span class="info-user" id="infoUser"></span>
    </div>

    <div class="kpi-row">
        <div class="kpi-card glass-panel"><div class="kpi-title">Colaboradores (visíveis)</div><div class="kpi-value" id="kpiTotal">0</div></div>
        <div class="kpi-card green glass-panel"><div class="kpi-title">Preencheram</div><div class="kpi-value" id="kpiPreenchidos">0</div></div>
        <div class="kpi-card red glass-panel"><div class="kpi-title">Não preencheram</div><div class="kpi-value" id="kpiNaoPreenchidos">0</div></div>
        <div class="kpi-card warn glass-panel"><div class="kpi-title">Folgas registradas</div><div class="kpi-value" id="kpiFolgas">0</div></div>
    </div>

    <div class="warn-panel glass-panel" id="warnPanel" style="display:none;">
        <div class="warn-title">⚠️ Avisos de não preenchimento (marque se foi folga)</div>
        <div id="warnList"></div>
    </div>

    <div class="table-wrap glass-panel">
        <table id="tabela">
            <thead>
                <tr>
                    <th>Colaborador</th><th>Cargo</th><th>Status</th><th>Entrada</th><th>Saída</th>
                    <th>Atividades</th><th>Preenchido</th><th>Preenchido por</th>
                    <th id="thFolga" style="display:none;">Folga?</th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr><td colspan="9" style="text-align:center; padding:20px; color:var(--text-muted);">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="saved-toast" id="savedToast">💾 Salvo!</div>

    <script>
        const FIREBASE_URL = "https://reportes-bdb0a-default-rtdb.firebaseio.com/";
        const NODE_CONFIG = "tdm_config";
        const NODE_DIARIO = "tdm_diario";

        const currentUser = JSON.parse(localStorage.getItem('loggedUser')) || null;
        const userName = currentUser && currentUser.usuario ? currentUser.usuario : '';
        const isAdmin = !!(currentUser && currentUser.cargo === 'admin');

        let config = { cargos: {}, colaboradores: {} };
        let diarioDia = {};   // { <colabKey>: {...} } para a data selecionada

        function syncTheme() { const t = localStorage.getItem('themePreference') || 'light'; document.body.setAttribute('data-theme', t); }
        syncTheme();
        window.addEventListener('message', (e) => { if (e.data.type === 'THEME_CHANGED') document.body.setAttribute('data-theme', e.data.theme); });

        function escapeHtml(v) { return String(v ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;'); }
        function hojeISO() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function toast(msg) {
            const t = document.getElementById('savedToast');
            t.textContent = msg || '💾 Salvo!';
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 1800);
        }

        async function carregarConfig() {
            try {
                const res = await fetch(`${FIREBASE_URL}${NODE_CONFIG}.json`);
                const data = await res.json();
                config = data && data.cargos ? data : { cargos: {}, colaboradores: {} };
            } catch (e) { config = { cargos: {}, colaboradores: {} }; }
        }

        // Colaboradores visíveis ao usuário atual
        function colaboradoresVisiveis() {
            const all = Object.keys(config.colaboradores || {})
                .map(k => ({ key: k, ...config.colaboradores[k] }))
                .filter(c => c.ativo !== false)
                .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
            if (isAdmin) return all;
            return all.filter(c => c.conta && userName && c.conta.toLowerCase() === userName.toLowerCase());
        }

        function normalizarAtividades(lista) {
            return (Array.isArray(lista) ? lista : []).map((item, index) => {
                if (typeof item === 'string') return { id: item, nome: item };
                const nome = String(item && (item.nome || item.name || item.titulo || item.atividade) || '').trim();
                return { id: String(item && item.id || nome || `atividade_${index}`), nome };
            }).filter(a => a.nome);
        }

        function atividadesFeitas(colab, reg) {
            const atividades = normalizarAtividades(colab.atividades);
            const own = Array.isArray(reg && reg.checks) ? reg.checks : [];
            const apoio = Array.isArray(reg && reg.supportChecks) ? reg.supportChecks : [];
            return atividades.filter(a => own.includes(a.id) || own.includes(a.nome) || apoio.includes(a.id) || apoio.includes(a.nome));
        }

        function apoiosFeitos(colab, reg) {
            const atividades = normalizarAtividades(colab.atividades);
            const apoio = Array.isArray(reg && reg.supportChecks) ? reg.supportChecks : [];
            return atividades.filter(a => apoio.includes(a.id) || apoio.includes(a.nome));
        }

        function regPreenchido(reg) {
            if (!reg) return false;
            // supportChecks pertence ao TDM de quem estava de folga; nunca vira
            // atividade obrigatória no histórico do backup.
            const temCheckProprio = Array.isArray(reg.checks) && reg.checks.length > 0;
            return !!(temCheckProprio || reg.status || reg.entrada || reg.saida);
        }

        async function carregarDia() {
            const dataKey = document.getElementById('dataSelecionada').value || hojeISO();
            try {
                const res = await fetch(`${FIREBASE_URL}${NODE_DIARIO}/${dataKey}.json`);
                diarioDia = await res.json() || {};
            } catch (e) { diarioDia = {}; }
            renderizar();
        }

        function mudarDia(delta) {
            const input = document.getElementById('dataSelecionada');
            const d = new Date(input.value + 'T12:00:00');
            d.setDate(d.getDate() + delta);
            input.value = d.toISOString().slice(0, 10);
            carregarDia();
        }
        function irParaHoje() { document.getElementById('dataSelecionada').value = hojeISO(); carregarDia(); }

        function renderizar() {
            const iu = document.getElementById('infoUser');
            iu.innerText = currentUser
                ? `👤 ${currentUser.usuario} (${isAdmin ? 'Administrador — vê todos' : 'Vê apenas os dados vinculados a você'})`
                : '⚠️ Faça login para ver seus dados';

            document.getElementById('thFolga').style.display = isAdmin ? '' : 'none';

            const colabs = colaboradoresVisiveis();
            let preenchidos = 0, folgas = 0;

            const rows = colabs.map(colab => {
                const reg = diarioDia[colab.key] || {};
                const preenchido = regPreenchido(reg);
                if (preenchido) preenchidos++;
                const folga = reg.folga === true;
                if (folga) folgas++;

                const status = reg.status || (reg.folga === true ? 'folga' : '');
                const statusPill = status
                    ? `<span class="pill ${status === 'folga' ? 'folga' : status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`
                    : `<span class="pill vazio">—</span>`;

                const total = normalizarAtividades(colab.atividades).length;
                const feitas = atividadesFeitas(colab, reg);
                const apoios = apoiosFeitos(colab, reg);
                const done = feitas.length;
                const pct = total > 0 ? Math.round((done / total) * 100) : 0;

                let folgaHtml = '';
                if (isAdmin) {
                    const clsSim = reg.folga === true ? 'folga-btn sim' : 'folga-btn';
                    const clsNao = reg.folga === false ? 'folga-btn nao' : 'folga-btn';
                    folgaHtml = `<button class="${clsSim}" onclick="setFolga('${colab.key}', true)">✅ Folga</button>
                                  <button class="${clsNao}" onclick="setFolga('${colab.key}', false)">❌ Não</button>`;
                }

                return `<tr>
                    <td><strong style="color:var(--text-title);">${escapeHtml(colab.nome)}</strong></td>
                    <td>${escapeHtml(colab.cargo || '—')}</td>
                    <td>${statusPill}</td>
                    <td>${escapeHtml(reg.entrada || '—')}</td>
                    <td>${escapeHtml(reg.saida || '—')}</td>
                    <td><div style="display:flex; align-items:center; gap:8px;"><div class="progress"><div style="width:${pct}%"></div></div><span style="font-weight:800;">${done}/${total}</span>${apoios.length ? `<small style="color:var(--accent-blue); font-weight:800;"> · ${apoios.length} apoio</small>` : ''}</div></td>
                    <td>${preenchido ? '<span class="ok">✅ Sim</span>' : '<span class="no">❌ Não</span>'}</td>
                    <td>${escapeHtml(reg.preenchidoPor || '—')}</td>
                    ${isAdmin ? `<td>${folgaHtml}</td>` : ''}
                </tr>`;
            }).join('');

            document.getElementById('tbody').innerHTML = rows || '<tr><td colspan="9" style="text-align:center; padding:20px; color:var(--text-muted);">Nenhum colaborador vinculado a você.</td></tr>';

            const naoPreenchidos = colabs.length - preenchidos;
            document.getElementById('kpiTotal').innerText = colabs.length;
            document.getElementById('kpiPreenchidos').innerText = preenchidos;
            document.getElementById('kpiNaoPreenchidos').innerText = naoPreenchidos;
            document.getElementById('kpiFolgas').innerText = folgas;

            // Avisos de não preenchimento (apenas admin)
            const warnPanel = document.getElementById('warnPanel');
            if (isAdmin) {
                const naoPreenchidosList = colabs.filter(c => !regPreenchido(diarioDia[c.key] || {}));
                if (naoPreenchidosList.length > 0) {
                    warnPanel.style.display = 'block';
                    document.getElementById('warnList').innerHTML = naoPreenchidosList.map(c => {
                        const reg = diarioDia[c.key] || {};
                        const folgaEstado = reg.folga === true ? '<span class="pill presente">Folga</span>'
                                          : reg.folga === false ? '<span class="pill falta">Não folga</span>'
                                          : '<span style="color:var(--text-muted); font-weight:700;">Aguardando avaliação</span>';
                        return `<div class="warn-item">
                            <span class="nm">${escapeHtml(c.nome)}</span>
                            <span style="color:var(--text-muted);">(${escapeHtml(c.cargo || 'sem cargo')}) não preencheu neste dia.</span>
                            <span>${folgaEstado}</span>
                            <div style="display:flex; gap:6px;">
                                <button class="${reg.folga === true ? 'folga-btn sim' : 'folga-btn'}" onclick="setFolga('${c.key}', true)">✅ Foi folga</button>
                                <button class="${reg.folga === false ? 'folga-btn nao' : 'folga-btn'}" onclick="setFolga('${c.key}', false)">❌ Não foi folga</button>
                            </div>
                        </div>`;
                    }).join('');
                } else {
                    warnPanel.style.display = 'none';
                }
            } else {
                warnPanel.style.display = 'none';
            }
        }

        async function setFolga(colabKey, valor) {
            if (!isAdmin) return;
            const dataKey = document.getElementById('dataSelecionada').value || hojeISO();
            const reg = diarioDia[colabKey] = diarioDia[colabKey] || {};
            reg.folga = valor;
            if (valor) reg.status = 'folga';
            else if (reg.status === 'folga') reg.status = '';
            reg.updatedAt = Date.now();
            reg.avaliadoPor = userName;
            try {
                await fetch(`${FIREBASE_URL}${NODE_DIARIO}/${dataKey}/${colabKey}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reg)
                });
                toast(valor ? '✅ Marcado como folga.' : '❌ Marcado como NÃO folga.');
                renderizar();
            } catch (e) { alert('Erro ao salvar.'); }
        }

        async function init() {
            document.getElementById('dataSelecionada').value = hojeISO();
            await carregarConfig();
            await carregarDia();
        }
        init();
    </script>
</body>
</html>
